  <!-- Lane numbers (sketchy) -->
  <g fill="#0F61FE" font-family="Figtree, sans-serif" font-size="11" font-weight="700" opacity="0.55">
    <text x="112" y="108">4</text>
    <text x="232" y="100">3</text>
    <text x="352" y="92">2</text>
    <text x="472" y="86">1</text>
  </g>

  <!-- Green accent dashes -->
  <g stroke="#10B981" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <path d="M160 74 L178 70"/>
    <path d="M420 42 L440 40"/>
    <path d="M700 54 L720 58"/>
