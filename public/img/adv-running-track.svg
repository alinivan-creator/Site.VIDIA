  <path d="M28 88 C190 68 330 50 480 46 C630 42 770 52 932 78" stroke="#0F61FE" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  <path d="M36 78 C200 58 340 40 480 36 C620 32 760 42 924 68" stroke="#0F61FE" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
  <path d="M44 68 C210 48 350 30 480 26 C610 22 750 32 916 58" stroke="#0F61FE" stroke-width="2" stroke-linecap="round"/>

  <!-- Lane ticks -->
